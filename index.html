<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📚 Biblioteca Virtual MVP</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Fuente y estilos personalizados -->
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4 display-4 text-gradient">📚 Biblioteca Virtual</h1>
    
    <!-- Barra de búsqueda y botón -->
    <div class="row mb-4 align-items-center justify-content-between">
      <div class="col-md-8 mb-2 mb-md-0">
        <input type="text" id="searchInput" class="form-control" placeholder="Buscar por título o autor..."/>
      </div>
      <div class="col-md-4 text-end">
        <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#bookModal" onclick="prepareAdd()">+ Añadir Libro</button>
      </div>
    </div>
    
    <!-- Contenedor de libros -->
    <div class="row" id="booksContainer">
      <!-- Libros se renderizarán aquí -->
    </div>
  </div>

  <!-- Modal para añadir/editar libro -->
  <div class="modal fade" id="bookModal" tabindex="-1" aria-labelledby="bookModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content bg-gradient p-4 rounded-4 shadow-lg text-white">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title" id="bookModalLabel">Agregar Libro</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="bookForm" class="d-flex flex-column gap-3">
            <input type="hidden" id="bookId" />
            <div>
              <label for="title" class="form-label">Título</label>
              <input type="text" class="form-control" id="title" required />
            </div>
            <div>
              <label for="author" class="form-label">Autor</label>
              <input type="text" class="form-control" id="author" required />
            </div>
            <div>
              <label for="year" class="form-label">Año</label>
              <input type="number" class="form-control" id="year" required min="1000" max="2099"/>
            </div>
            <div class="d-flex justify-content-end mt-3">
              <button type="submit" class="btn btn-primary btn-lg">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script principal -->
  <script src="script.js"></script>
</body>
</html>
